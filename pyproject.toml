[project]
name = "football-team-agent"
version = "1.0.0"
description = "Build, test and analyse a football XI, with a verified AI assistant."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "requests>=2.31",
    "click>=8.1",
]

[project.scripts]
fta = "fta.cli:main"

[project.optional-dependencies]
ui = ["streamlit>=1.64", "pandas>=2.2", "altair>=5"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]
kaggle = ["kagglehub>=0.3"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
